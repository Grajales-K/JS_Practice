        <div class="nav">
                <p id="display">Cart quantity: 0</p>

                <!-- we print the cart quantity to the console because there is no operation to display the cart quantity on the page. -->
                <button onclick="
                        console.log(`Cart quantity: ${cartQuantity}`);">
                        Show Quantity
                </button>

                <button onclick="
                        updateCartQuantity(1);">
                        Add to Cart
                </button>

                <button onclick="
                        updateCartQuantity(2);">
                        +2
                </button>

                <button onclick="
                        updateCartQuantity(3);">
                        +3
                </button>

                <button onclick="
                        cartQuantity = 0;
                        console.log(`Cart quantity was reset: ${cartQuantity}`);
                        displayQuantity();
                ">Reset Cart
                </button>
        </div>

        <script>
                let cartQuantity = 0;

                function displayQuantity() {
                        document.getElementById('display').innerText = `Cart quantity: ${cartQuantity}`;
                }

                function updateCartQuantity(change) {
                  
                        if (cartQuantity + change < 0) {
                                alert('Not enough items in the cart');
                                return; // Early return
                        }

                        
                        cartQuantity += change;
                        console.log(`Cart quantity: ${cartQuantity}`);
                        
                        displayQuantity();
                        
                }

        </script>
