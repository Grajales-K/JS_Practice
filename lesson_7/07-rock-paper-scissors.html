<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissorss</title>
</head>

<body>
    <div class="nav">
        <p>Rock Paper Scissors</p>
        <button onclick="
            pickComputerMove();

            let result = '';

            if (computerMove === 'rock'){
                result = 'Tie.'
            } else if (computerMove === 'paper'){
                result = 'You lose.'
            } else if (computerMove === 'scissors'){
                result = 'You Win.'
            };

            alert(`You picked rock. Computer picked a ${computerMove}. ${result}`);

        ">Rock</button>

        <button onclick="
            pickComputerMove();
    
    
            let result = '';
    
            if (computerMove === 'rock'){
                result = 'You Win.'
            } else if (computerMove === 'paper'){
                result = 'Tie.'
            } else if (computerMove === 'scissors'){
                result = 'You Lose.'
            };
    
            alert(`You picked paper. Computer picked a ${computerMove}. ${result}`);

        ">Paper</button>

        <button onclick="
            pickComputerMove();
    
            let result = '';
    
            if (computerMove === 'rock'){
                result = 'You Lose.'
            } else if (computerMove === 'paper'){
                result = 'You Win.'
            } else if (computerMove === 'scissors'){
                result = 'Tie.'
            };

            alert(`You picked Scissors. Computer picked a ${computerMove}. ${result}`);

        ">Scissors</button>
    </div>

    <script>

        let computerMove = '';

        function pickComputerMove() {

            const randomNumber = Math.random();

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';
            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper'
            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'scissors'
            };

        }


    </script>
</body>

</html>
