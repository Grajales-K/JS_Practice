  <script>

    /* 11o. Create and array of strings, loop over the array, and ckeck if the string 'search' is inside the array. if it is, console.log() the index of it in the array, if not, console.log '-1'.
    
    ['hello', 'world', 'search', 'good'] => console.log(2)
    ['not', 'found'] => console.log(-1) */

    const stringArr = ['hello', 'world', 'search', 'good'];
    const stringArr2 = ['not', 'found'];

    let foundIndex = -1;

    for (let i = 0; i < stringArr.length; i++) {
      if (stringArr[i] === 'search') {
        foundIndex = i;
      }
    }
    console.log(foundIndex);

    // Modify 11o so that if 'search' appears multiple times in the array, console.log the firs element of it in the array.

    console.log('======== 11q Create a function(arr, word) ========');
    // Create a funcion findeIndex(arr, word) that searches an array for a string (in the word parameter) and returns the index of the first appearance of the string. if it does't exist in the array, return -1

    function findIndex(arr, word) {
      let foundIndex = -1;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] === word) {
          foundIndex = i;
          break; // exit the loop once found
        }
      }
      return foundIndex;
    }

    console.log(findIndex(['green', 'blue', 'red', 'yellow'], 'red'));// 2
    console.log(findIndex(['green', 'blue', 'red'], 'yellow')); // -1


    console.log('======== 11r Create a funtion removeEgg(foods) ========');
    // Create a function removeEgg(foods) that takes an array of string and returns an array where the string 'egg' is removed. (hint: loop through the array and check if each string is 'egg', if it is continue; to skip it, if it's not 'egg', add it to the result) 
    // removeEgg(['egg', 'appe', 'egg', 'egg', 'ham']) => ['appe', 'ham']

    function removeEgg(foods) {
      let newArr = [];
      for (let i = 0; i < foods.length; i++) {
        if (foods[i] === 'egg') {
          continue;
        } else {
          newArr.push(foods[i])
        }
      }

      return newArr;
    }

    console.log(removeEgg(['egg', 'appe', 'egg', 'egg', 'ham'])); // ['appe', 'ham']

    // Arrays have a method called .reverse() which reverses the order of the values in the array, update the  exercises 11s to only remove the last 2 egg. from the array.
    // removeEgg(['egg', 'appe', 'egg', 'egg', 'ham']) => ['egg', 'appe', 'ham']

    function removeEgg3(foods) {
      let newArr = [];
