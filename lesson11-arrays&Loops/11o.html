    // Create a funcion findeIndex(arr, word) that searches an array for a string (in the word parameter) and returns the index of the first appearance of the string. if it does't exist in the array, return -1

    /* 11v. we'll do the famous fizzbuzz problem. create a loop. that displays 1 to 20 in the console. 
    if the nunber is divisible by 3, console.log 'fizz', 
    if the number is divisible by 5, console.log 'buzz',

    //  We check 3 and 5 first because 15 is divisible by both.If we check 3 first, 15 will be caught by that condition and fizzbuzz will never run.

    // 11w. Create a copy of the exercise 11q. Where we created findIndex(). Bellow it, create a function unique(arr) where each string only appears once (there are no duplicates). Try to use the findIndex() function in your solution.
    // unique(['green', 'blue', 'red', 'green', 'blue']) => ['green', 'blue', 'red']

    //11q
    function findIndex(arr, word) {
      let foundIndex = -1;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] === word) {
          foundIndex = i;
          break; // exit the loop once found
        }
      }
      return foundIndex;
    }

    const colors = ['green', 'green', 'blue', 'red', 'green', 'blue']

    function unique(arr) {
      let result = [];

      for (let i = 0; i < arr.length; i++) {
        // we need to pick each word from our arr.
        const word = arr[i];

        // we recall the findIndex() function we created earlier to check if the word is already in our result array.
        if (findIndex(result, word) === -1) {
          result.push(word);
        }

      }
      return result;
    }

    console.log(unique(colors));// ['green', 'blue', 'red']
