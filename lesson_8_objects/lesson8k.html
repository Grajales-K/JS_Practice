<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 8 - LocalStorage</title>

</head>

<body>
    <header>
        <h1>Coin-Flip game practice</h1>
    </header>
    <p>Open the console to check the results</p>

    <div>
        <button onclick="
                updateGuess('heads')
            ">Heads
        </button>

        <button onclick="
                updateGuess('tails')
            ">
            Tails
        </button>
    </div>

    <script>
        /*
        8i.  We'll improve the coin flip game from exercise 6j to be like the rock paper scissor game, 

        1. create two buttons to play the game, heads and tails
        2. when clicling 'tails' play the game with guess = 'tails'.
        3. create a function playGame(guess) to rehuse the code.
        */



        // 8j. Create a score object { wins: 0 losses: 0 } update the score each time after playing, and display the score in the console.

        // step 1, we need to use parse to save and read the score in localStorage, and if there is no score in localStorage, we need to create a new score object with wins and losses set to 0.
        let score =  JSON.parse(localStorage.getItem("score")) || {
            wins: 0,
            losses: 0

        }

        showScore();
        showScore();


        function updateGuess(guess) {

            const randomNumber = Math.random();
            const result = randomNumber < 0.5 ? 'heads' : 'tails';

            if (guess === result) {
                score.wins++;
                console.log(`computer picked: ${result}, you picked: ${guess}`);
                console.log(`computer picked: ${result}, you picked: ${guess}`);
            } else {
                score.losses++;
                console.log(`computer picked: ${result}, you picked: ${guess}`);
            }

            // 8.k Use localStorage to save and load the score (hint: you'll need to use JSON.stringify() and to connvert the score object to a string)

            // step 2, we need to use stringify to save the score object in localStorage.
            localStorage.setItem("score", JSON.stringify(score));

            // step 3, we need to show the score in the console after each game.
            showScore();
            showScore();


        }


        function showScore() {
        function showScore() {
            console.log(`Score: Wins: ${score.wins}, Losses: ${score.losses}`);

        }
    </script>
</body>

</html>
