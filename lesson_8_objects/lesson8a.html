<!DOCTYPE html>

<body>
    <h1>Welcome to Lesson 8: Objects</h1>
    <script>

        //8a. let's create an object to product, 

        const basketballProduct = {
            name: "Basketball",
            price: 2095,
        };

        console.log(basketballProduct.name);


        //8b. Increase the price by 500 cents. use dot notation to to increase the price and display the updated price in the console.

        basketballProduct.price += 500;

        console.log(basketballProduct.price); //2595


        //8c. Using bracket notation, add a property 'delivery-time' tot the object with a value '3 days'. Display the updated object in the console.

        basketballProduct['delivery-time'] = '3 days';

        console.log(basketballProduct);

        //8d. Create a function 'comparePrice(product1, product2)' which takes 2 products (with 'name' and 'price' properties) and return the product that is less expensive. Create 2 products and try out the function.

        const product1 = {
            name: "basketball",
            price: 3090
        };

        const product2 = {
            name: "soccer ball",
            price: 2090
        };


        function comparePrice(product1, product2) {
            if (product1.price < product2.price) {
                return product1;
            } else {
                return product2;
            }
        };

        console.log(comparePrice(product1, product2)); // {name: "soccer ball", price: 2090}


    </script>
</body>
