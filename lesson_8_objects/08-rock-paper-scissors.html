<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
</head>

<body>
    <div class="nav">
        <p>Rock Paper Scissors</p>

        <button onclick="
            playGame('rock');
        ">Rock</button>

        <button onclick="
            playGame('paper');
        ">Scissors</button>

        <button onclick="
            playGame('scissors');
        ">Scissors</button>

        <button onclick="
            score.wins = 0;
            score.losses = 0;   
            score.ties = 0;
        ">Reset</button>

    </div>

    <script>
        //this will store the score of the game and update it after each round
        const score = {
            wins: 0,
            losses: 0,
            ties: 0
        }

        function playGame(playerMove){
            const computerMove = pickComputerMove();

            let result = '';

            if(playerMove === 'rock'){
                if (computerMove === 'rock') {
                    result = 'Tie.'
                } else if (computerMove === 'paper') {
                    result = 'You Lose.'
                } else if (computerMove === 'scissors') {
                    result = 'You Win.'
                };

            } else if (playerMove === 'paper'){
                if (computerMove === 'rock') {
                    result = 'You Win.'
                } else if (computerMove === 'paper') {
                    result = 'Tie.'
                } else if (computerMove === 'scissors') {
                    result = 'You Lose.'
                };

            }else if (playerMove === 'scissors') {
                if (computerMove === 'rock') {
                    result = 'You Lose.'
                } else if (computerMove === 'paper') {
                    result = 'You Win.'
                } else if (computerMove === 'scissors') {
                    result = 'Tie.'
                };
            }

            //we use the assignment operator to update the score object based on the result of the game
            if(result === 'You Win.') {
                score.wins += 1;
            } else if (result === 'You Lose.') {
                score.losses += 1;
            } else if (result === 'Tie.') {
                score.ties += 1;

            }

            // return result;
            // the pop up can display multi line information using template literals
            alert(`You picked ${playerMove}, Computer picked ${computerMove}, ${result}

            wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);

        }

        function pickComputerMove() {
            let computerMove = '';

            const randomNumber = Math.random();

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'rock';

            } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'paper'

            } else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'scissors'
            };
            
            return computerMove;
        }

    </script>
</body>

</html>
