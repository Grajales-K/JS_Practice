<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Objects</title>
  </head>

  <body>
    <script>

      console.log(" ======================= objects ========================= ");

      const products ={
          name: "socks",
          price: 1098
      };
      
      //to print what type of data type is products
      console.log(typeof products);
      console.log(products.name);

      //object is products and property is price  ==>  property value-pair
      console.log(products.price);

      products.name = "cotton socks";
      console.log(products.name);

      products.newProperty = true;
      console.log(products);

      // removing one property from the object
      delete products.newProperty;
      console.log(products);


      console.log(" ======================= accessing object properties ========================= ");

      const product2 = {
        name: "shirt",
        price: 1999,
        //if we have complex property name, we can use quotes
        'delivery-time': "2 days",

        ['delivery-week']: "1 week",

        rating: {
          stars: 4.5,
          count: 87,
        },
        fun: function() {
          console.log("this is a function inside an object");
        }
      }

      console.log(product2.name);
      console.log(product2["price"]);

      //to access the complex property name we can use bracket notation
      console.log(product2['delivery-time']);

      console.log(product2['delivery-week']);

      console.log(product2.rating.starts);

      product2.fun();

      console.log(typeof console.log);
      

      console.log(" ======================= built in Objects ========================= ");

      //converting object into JSON string
      console.log(JSON.stringify(product2))

      const jsonString = JSON.stringify(product2);
      console.log(JSON.parse(jsonString))


      console.log(" ======================= object Methods (auto-boxing)========================= ");

      console.log('hello'.length);
      console.log('hello'.toUpperCase());


      // Copying a reference means both variables point to the same object,
      //  so if we change object2, object1 will also change.
      const object1 = {
        message: "hello",
      };

      //DESTRUCTURING, easier way to take properties out of and object and assign them to variables

      const object2 = object1

      object1.message = "Good job";
      console.log(object1)//new message
      console.log(object2)//same message

      const object3 = {
        message: "Good job",
      };

      console.log(object1 === object3) //false because they are different objects

      console.log( object2 === object1) //true because they are the same object

      const object4 = {
        message: "Good job",
        price: 799
      };

      // const message = object4.message

      //shortcut to access the property of an object
      const { message, price } = object4;
      console.log(message, price);

      console.log(" ======================= object property shorthand Method ========================= ");

      const object5 ={ 
        //shortcut to access the property of an object
        // message: message
        message,
        number: 123,
        // method: function function1(){
        //   console.log("this is a method inside an object")
        // }

        // shortcut
        method(){
          console.log('method')
        }
      }

      console.log(object5)


 
    </script>
  </body>
</html>
