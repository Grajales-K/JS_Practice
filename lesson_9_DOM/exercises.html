<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson9 Exercises</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f6f8;
            color: #333;
            text-align: center;
        }

        div {
            margin: 2rem;
        }

    
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #6a4af9;
            color: white;
            margin-right: 8px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #ac61ef;
        }

        .card-container {
            margin: 20px auto;
            padding: 20px;
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 400px;
        }

        .btn-heads {
            background-color: #3b82f6;
            color: white;
        }

        .btn-heads:hover {
            background-color: #2563eb;
        }

        .btn-tails {
            background-color: #35f1b3;
            color: white;
        }

        .btn-tails:hover {
            background-color: #059669;
        }

        .selection {
            font-weight: bold;
            font-size: 16px;
            color: #1f2937;
            margin-top: 15px;
            }

        #userText {
            width: 170px;      
            padding: 8px 12px;
            margin-bottom: 10px; 
        }

        .userName {
            font-weight: bold;
            font-size: 16px;
            color: #1f2937;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    

    <!-- //create a <button>9a</button>, use document.querySelector(button), to get the button from the page, and tehn display it in the console. -->
    <div class="card-container">
        <p>Selecting DOM elements and modifying their text dynamically.</p>
        <button class="btn_9a">9a</button>

        <button class="btn_9b">9b</button>
    </div>

    
    <!-- 9c. Create 2 button "heads" and "tails", and a paragraph (<p></p>) understand. When clicking the 'heads' button, display "You choose: heads" in the the paragraph. when the 'tails' button, display "You choose: tails" -->
    <div class="card-container">
        <p>Reusing a single function by passing parameters/arguments.</p>

        <button class="btn-heads" onclick="
            updateSelection('Heads')
            ">  
            Heads
        </button>

        <button class="btn-tails" onclick="
            updateSelection('Tails')
            ">  
            Tails
        </button>

        <p class="selection">

        </p>
    </div>

    <!-- 
     9d. Create a text box, <input> and submit button. When clicking 'submit', display 'your name is ${name}' on the page extracting the text from the text box. Hint: use .value to get the text inside of the input. -->
    <div class="card-container">
        <p>Reading input values, string formatting, and keyboard events.</p>
        <div>
            <input
                id="userText" 
                type="text" 
                placeholder="write your Name"
                onkeydown="
                    handleKeyDown(event);
                "/>

            <button class="btn-heads"
                type="button"
                onclick=" displayName();">
            Submit</button>
        </div>

        <p class="userName">

        </p>
    </div>


    <script>
        // 9a
        const firstbtn = document.querySelector('.btn_9a');
        console.log(firstbtn);

        // 9b
        // create another button 9b, change the text to "9b done", using JS. Hint: add a class and use .querySelector.
        const secondBtn = document.querySelector('.btn_9b');
        secondBtn.innerText = "9b done";
        console.log(secondBtn);


        // 9c
        function updateSelection(choice){

            // Select the element using its class name '.selection'
            const selectionParagraph = document.querySelector('.selection');

            // Update the text directly using the choice argument
            selectionParagraph.innerText = `You choose: ${choice.toLowerCase()}`;
        }


        // 9d
        function displayName(){
            const InputText = document.querySelector('#userText')
            const name = InputText.value;

            const displayNameParagraph = document.querySelector('.userName')

            const CapitalizeName = name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();

            displayNameParagraph.innerText = `Your name is: ${CapitalizeName}`;
        }

        // 9e - 9f
        // Call displayName() when the user presses Enter
        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                displayName();
            }
        }

    </script>
</body>
</html>
