    <script>

        console.log("------- 12j. Arrow Function multiply ---------");
        // 12j. Create and arrow fucntion called 'multiply' that takes 2 numbers, multiplies them together, and returns the result. multiply(2, 3) should return 6, multiply(5, 10) => 70

        const multiply = (a, b) => {
            console.log(a * b)
        }

        multiply(2, 3)
        multiply(5, 10)

        // 12k continuing from exercise 12j, write the arrow function on one line
        
        const multiply2 = (a, b) => a * b;

        console.log(multiply2(5, 10)) //50


        /*12l. create a function countPosive(nums) that takes an array of numbers and return how many numbers in the array are greater than 0. Create this function using forEach() instead of a loop. 
        * countPositive([1, -3, 5]) => 2, 
        * countPositive([-2, 3, -5, 7, 10 ]) => 3 */

        function countPositive(nums){

            let count = 0;
            nums.forEach((number) => {
                if (number > 0){
                    count++
                }
            })

            console.log(count) //this is for to see the result in the console.
            return count;
        }

        countPositive([1, -3, 5]) //2
        countPositive([-2, 3, -5, 7, 10]) //3

        /* 12m. Create a function addNum(array, num) that takes an array of numbers and returns an array where each number is increased by "num". Create a this function using .map() instead of a loop.
        * addNum([1, 2, 3], 2) => [3, 4, 5]
        * addNum([-2, -1, 0, 99], 2) => [0, 1, 2, 101]
        try to use a shortcut in your solution */

        const addNum = (array, num) => array.map((x) => x + num)

        console.log(addNum([1, 2, 3], 2)) // [3, 4, 5]
        console.log(addNum([-2, -1, 0, 99], 2)) //[0, 1, 2, 101]

        



    </script>
