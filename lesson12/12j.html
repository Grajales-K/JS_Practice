        /*12l. create a function countPosive(nums) that takes an array of numbers and return how many numbers in the array are greater than 0. Create this function using forEach() instead of a loop. 
        * countPositive([1, -3, 5]) => 2, 
        * countPositive([-2, 3, -5, 7, 10 ]) => 3 */

        function countPositive(nums) {

            let count = 0;
            nums.forEach((number) => {
                if (number > 0) {
                    count++
                }
            })

            console.log(count) //this is for to see the result in the console.
            return count;
        }
