<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="styles/12-rock-paper-scissors.css">
</head>

<body>
    <div class="nav">
        <p class="title">Rock Paper Scissors</p>

        <button class='move-button js-rock-button'>
            <img src="/img-exercises/lesson10/rock-emoji.png" class="move-icon"></button>

        <button class="move-button js-paper-button">
            <img src="/img-exercises/lesson10/paper-emoji.png" class="move-icon"></button>

        <button class="move-button js-scissors-button">
            <img src="/img-exercises/lesson10/scissors-emoji.png" class="move-icon"></button>


        <p class="js-result result"></p>
        <p class="js-moves"></p>
        <p class="js-score score"></p>

        <button class="reset-score-button">Reset Score</button>

        <button class="auto-play-button">Auto Play</button>

        <p class="reset-message"></p>

    </div>

    <script src="scripts/12-rock-paper-scissors.js">
    </script>
</body>

</html>
